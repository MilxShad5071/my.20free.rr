<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Задачник C++ · Базовые средства</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 32px -10px rgba(0,0,0,0.12);
            padding: 18px 16px 28px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #64748b;
            margin-left: auto;
            white-space: nowrap;
        }
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border-radius: 40px;
            padding: 8px 14px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
            font-size: 0.85rem;
            gap: 6px 10px;
        }
        .stats-bar span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge {
            background: #dbeafe;
            color: #1e4a7a;
            border-radius: 40px;
            padding: 2px 12px;
            font-weight: 500;
            font-size: 0.75rem;
        }
        .score-badge {
            background: #1e293b;
            color: white;
            border-radius: 40px;
            padding: 2px 14px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 8px;
            margin-bottom: 18px;
            border-bottom: 1px dashed #d1d9e6;
            padding-bottom: 14px;
        }
        .menu-btn {
            background: transparent;
            border: 1px solid #d1d9e6;
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.78rem;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .menu-btn:active {
            transform: scale(0.94);
            background: #eef2f6;
        }
        .menu-btn.active {
            background: #1e293b;
            border-color: #1e293b;
            color: white;
        }
        .question-panel {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 16px 20px;
            border: 1px solid #eef2f6;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 12px;
            gap: 6px;
        }
        .q-tag {
            background: #e9edf2;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #475569;
        }
        .counter {
            font-size: 0.78rem;
            color: #475569;
            background: #f1f4f9;
            padding: 3px 12px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .q-text {
            font-size: 1.08rem;
            font-weight: 500;
            line-height: 1.5;
            margin: 8px 0 14px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 14px 0 16px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 14px;
            background: #fafcff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.08s;
            touch-action: manipulation;
        }
        .option:active {
            transform: scale(0.98);
            background: #f1f5f9;
        }
        .option input[type="radio"] {
            margin-top: 3px;
            accent-color: #1e293b;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option label {
            flex: 1;
            font-size: 0.96rem;
            cursor: pointer;
            line-height: 1.4;
            word-break: break-word;
        }
        .option.disabled {
            opacity: 0.7;
            cursor: default;
        }
        .option.disabled:active {
            transform: none;
        }
        .option.disabled:hover {
            background: #fafcff;
            border-color: #e2e8f0;
        }
        .option.selected {
            border-color: #1e293b;
            background: #f1f5f9;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }
        .btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
        }
        .btn:active {
            transform: scale(0.95);
            background: #0f172a;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-outline {
            background: transparent;
            color: #1e293b;
            border: 1.5px solid #cbd5e1;
        }
        .btn-outline:active {
            background: #f1f5f9;
        }
        .btn-success {
            background: #2b7a4b;
        }
        .btn-success:active {
            background: #1e5f39;
        }
        .btn-success:disabled {
            opacity: 0.5;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-buttons .btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            min-height: 40px;
        }
        .result-banner {
            margin-top: 24px;
            padding: 18px 16px;
            border-radius: 20px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            display: none;
            text-align: center;
        }
        .result-banner.show {
            display: block;
        }
        .result-banner .score {
            font-size: 2.6rem;
            font-weight: 700;
            color: #1e293b;
        }
        .result-banner .label {
            font-size: 1rem;
            color: #475569;
        }
        .result-banner .grade {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 4px;
            padding: 4px 18px;
            border-radius: 40px;
            display: inline-block;
        }
        .grade-5 { background: #dcfce7; color: #166534; }
        .grade-4 { background: #dbeafe; color: #1e4a7a; }
        .grade-3 { background: #fef9c3; color: #854d0e; }
        .grade-2 { background: #fee2e2; color: #991b1b; }
        .footer-note {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .status-msg {
            text-align: center;
            font-size: 0.9rem;
            color: #475569;
            margin: 8px 0 4px;
            padding: 8px;
            background: #f8fafc;
            border-radius: 12px;
        }
        .status-msg strong {
            color: #1e293b;
        }

        @media (max-width: 480px) {
            body { padding: 8px; }
            .container { padding: 12px 10px 20px; border-radius: 20px; }
            h1 { font-size: 1.25rem; }
            h1 small { font-size: 0.7rem; }
            .stats-bar { font-size: 0.75rem; padding: 6px 10px; gap: 4px 6px; }
            .menu-btn { font-size: 0.7rem; padding: 4px 10px; }
            .q-text { font-size: 0.98rem; }
            .option { padding: 10px 12px; gap: 10px; }
            .option label { font-size: 0.9rem; }
            .btn { padding: 8px 16px; font-size: 0.8rem; min-height: 38px; }
            .nav-buttons .btn { padding: 6px 12px; font-size: 0.78rem; min-height: 34px; }
            .result-banner .score { font-size: 2.2rem; }
        }
        @media (max-width: 380px) {
            .stats-bar span { font-size: 0.7rem; }
            .menu-btn { font-size: 0.65rem; padding: 3px 8px; }
        }
        @supports (padding: max(0px)) {
            .container { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
        }
        :focus { outline: none; }
        .option input[type="radio"]:focus-visible { outline: 2px solid #1e293b; }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>
        📘 Задачник C++
        <small>Базовые средства</small>
    </h1>

    <div class="stats-bar" id="statsBar">
        <span>📌 <span id="currentIdxDisplay">1</span>/<span id="totalQuestions">33</span></span>
        <span>📝 <span id="answeredCount">0</span> отв.</span>
        <span>📊 <span id="progressPercent">0</span>%</span>
        <span class="badge" id="sectionBadge">Разд. 1</span>
        <span class="score-badge" id="scoreBadge">⭐ 0</span>
    </div>

    <div class="menu-grid" id="menuGrid">
        <button class="menu-btn" data-section="0">1. Состав</button>
        <button class="menu-btn" data-section="1">2. Алфавит</button>
        <button class="menu-btn" data-section="2">3. Идентиф.</button>
        <button class="menu-btn" data-section="3">4. Ключ. слова</button>
        <button class="menu-btn" data-section="4">5. Константы</button>
        <button class="menu-btn" data-section="5">6. Упр. посл.</button>
        <button class="menu-btn" data-section="6">7. Коммент.</button>
        <button class="menu-btn" data-section="7">⭐ Тест</button>
    </div>

    <div class="question-panel">
        <div class="q-header">
            <span class="q-tag" id="qTag">Вопрос 1</span>
            <span class="counter" id="sectionCounter">Разд. 1 · 1/3</span>
        </div>
        <div class="q-text" id="qText">Загрузка...</div>

        <div class="options" id="optionsContainer"></div>

        <div class="status-msg" id="statusMsg">Выберите один вариант</div>

        <div class="action-row">
            <div class="nav-buttons">
                <button class="btn btn-outline" id="prevBtn">◀ Назад</button>
                <button class="btn btn-outline" id="nextBtn">Вперёд ▶</button>
            </div>
            <button class="btn btn-success" id="resetBtn">🔄 Сброс</button>
        </div>
    </div>

    <div class="result-banner" id="resultBanner">
        <div class="label">🏆 Результат</div>
        <div class="score" id="finalScore">0</div>
        <div style="font-size: 0.9rem; color: #475569;">из 100 баллов</div>
        <div class="grade" id="gradeBadge">—</div>
        <div style="margin-top: 10px; font-size: 0.88rem; color: #64748b;">
            Верно: <span id="finalCorrect">0</span> из <span id="finalTotal">33</span>
        </div>
        <button class="btn" id="resetAllBtn" style="margin-top: 14px;">🔄 Пройти заново</button>
    </div>

    <div class="footer-note">
        ⚡ 33 вопроса · Ответы сохраняются · Итоговая оценка после завершения всех вопросов
    </div>
</div>

<script>
    (function() {
        // ---------- ВОПРОСЫ ----------
        const questions = [
            // Раздел 0: Состав языка (стр. 15-16)
            {
                section: 0,
                question: 'Что такое лексема в языке программирования?',
                options: [
                    'Готовое предложение на языке программирования',
                    'Минимальная единица языка, имеющая самостоятельный смысл',
                    'Символ алфавита',
                    'Оператор цикла'
                ],
                correct: 1
            },
            {
                section: 0,
                question: 'Какое соответствие между элементами языка и их аналогами в естественном языке является ВЕРНЫМ?',
                options: [
                    'Лексема = Предложение, Выражение = Слово, Оператор = Словосочетание',
                    'Лексема = Слово, Выражение = Словосочетание, Оператор = Предложение',
                    'Лексема = Буква, Выражение = Слово, Оператор = Текст',
                    'Лексема = Словосочетание, Выражение = Предложение, Оператор = Абзац'
                ],
                correct: 1
            },
            {
                section: 0,
                question: 'Что делает компилятор?',
                options: [
                    'Исполняет программу на компьютере',
                    'Преобразует исходный код в объектный код',
                    'Объединяет объектные модули в исполняемый файл',
                    'Проверяет программу на наличие логических ошибок'
                ],
                correct: 1
            },
            // Раздел 1: Алфавит (стр. 18)
            {
                section: 1,
                question: 'Какие группы символов входят в алфавит C++?',
                options: [
                    'Только латинские буквы и цифры',
                    'Латинские буквы, цифры и пробелы',
                    'Латинские буквы, арабские цифры, специальные знаки и пробельные символы',
                    'Все символы клавиатуры'
                ],
                correct: 2
            },
            {
                section: 1,
                question: 'Какие из перечисленных символов являются пробельными в C++?',
                options: [
                    'Только пробел',
                    'Пробел, табуляция и перевод строки',
                    'Пробел и запятая',
                    'Все символы, которые не видны на экране'
                ],
                correct: 1
            },
            {
                section: 1,
                question: 'Какие из перечисленных символов относятся к специальным знакам в алфавите C++?',
                options: [
                    'Только +, -, *, /',
                    'Только {, }, [, ]',
                    'Все символы, кроме букв, цифр и пробелов',
                    'Только знаки препинания'
                ],
                correct: 2
            },
            // Раздел 2: Идентификаторы (стр. 18)
            {
                section: 2,
                question: 'Какой символ НЕ может быть первым в идентификаторе?',
                options: [
                    'Буква латинского алфавита',
                    'Знак подчеркивания',
                    'Цифра',
                    'Все перечисленные могут быть первыми'
                ],
                correct: 2
            },
            {
                section: 2,
                question: 'Являются ли идентификаторы `myVar`, `myvar` и `MYVAR` одним и тем же именем?',
                options: [
                    'Да, регистр букв не важен',
                    'Нет, это три разных имени',
                    'Да, если они объявлены в разных блоках',
                    'Зависит от компилятора'
                ],
                correct: 1
            },
            {
                section: 2,
                question: 'Какое имя соответствует венгерской нотации?',
                options: [
                    'max_length',
                    'iMaxLength',
                    'max_length_of_array',
                    'Mylength'
                ],
                correct: 1
            },
            {
                section: 2,
                question: 'Какой идентификатор является НЕДОПУСТИМЫМ?',
                options: [
                    '_private',
                    'myVar2',
                    '2ndValue',
                    'sysop'
                ],
                correct: 2
            },
            {
                section: 2,
                question: 'Почему не рекомендуется начинать идентификаторы с символа подчеркивания (`_`)?',
                options: [
                    'Это синтаксическая ошибка',
                    'Они могут совпасть с именами системных функций или переменных',
                    'Это ухудшает читаемость кода',
                    'Это запрещено стандартом'
                ],
                correct: 1
            },
            // Раздел 3: Ключевые слова (стр. 19)
            {
                section: 3,
                question: 'Что такое ключевые слова?',
                options: [
                    'Любые слова, которые используются в программе',
                    'Зарезервированные слова, которые нельзя использовать в качестве идентификаторов',
                    'Слова, определяемые программистом',
                    'Комментарии в программе'
                ],
                correct: 1
            },
            {
                section: 3,
                question: 'Можно ли использовать ключевое слово `int` в качестве имени переменной?',
                options: [
                    'Да, если очень нужно',
                    'Нет, это ключевое слово',
                    'Да, если добавить к нему цифру',
                    'Только в C, но не в C++'
                ],
                correct: 1
            },
            {
                section: 3,
                question: 'Какое из перечисленных слов НЕ является ключевым в C++?',
                options: [
                    'switch',
                    'while',
                    'printf',
                    'return'
                ],
                correct: 2
            },
            // Раздел 4: Константы (стр. 20-22)
            {
                section: 4,
                question: 'К какому типу относится константа `0x1B8`?',
                options: [
                    'Десятичная целая',
                    'Восьмеричная целая',
                    'Шестнадцатеричная целая',
                    'Вещественная'
                ],
                correct: 2
            },
            {
                section: 4,
                question: 'Как записывается восьмеричная константа?',
                options: [
                    'С нуля в начале (`01`, `020`, `07155`)',
                    'С префикса `0x`',
                    'С суффикса `L`',
                    'С десятичной точки'
                ],
                correct: 0
            },
            {
                section: 4,
                question: 'Какой формат записи имеет вещественная константа в экспоненциальной форме?',
                options: [
                    '5.7',
                    '0.2E6',
                    '0x1B8',
                    "'A'"
                ],
                correct: 1
            },
            {
                section: 4,
                question: 'Чем отличается символьная константа `\'A\'` от строковой `"A"`?',
                options: [
                    'Ничем, это одно и то же',
                    '`\'A\'` занимает 1 байт, `"A"` — 2 байта (с учётом нуль-символа)',
                    '`\'A\'` — это строка, `"A"` — символ',
                    '`\'A\'` нельзя использовать в cout'
                ],
                correct: 1
            },
            {
                section: 4,
                question: 'Как записать отрицательную целую константу?',
                options: [
                    'Использовать унарный минус перед константой (`-218`)',
                    'Использовать суффикс `-`',
                    'Записать число в скобках с минусом',
                    'Отрицательные константы не допускаются'
                ],
                correct: 0
            },
            {
                section: 4,
                question: 'Какое значение имеет строка с escape-последовательностью `"\\\\tЗначение\\\\n"`?',
                options: [
                    '\\tЗначение\\n',
                    'tЗначение',
                    '\\tЗначение (с табуляцией и переводом строки)',
                    'Значение'
                ],
                correct: 2
            },
            // Раздел 5: Управляющие последовательности (стр. 21-22)
            {
                section: 5,
                question: 'Что означает управляющая последовательность `\\n`?',
                options: [
                    'Звуковой сигнал',
                    'Перевод строки',
                    'Возврат каретки',
                    'Горизонтальная табуляция'
                ],
                correct: 1
            },
            {
                section: 5,
                question: 'Какая последовательность используется для вывода символа кавычки (`"`) внутри строки?',
                options: [
                    '\\"',
                    '\\\\',
                    "\\'",
                    '\\?'
                ],
                correct: 0
            },
            {
                section: 5,
                question: 'Что означает управляющая последовательность `\\a`?',
                options: [
                    'Отмена действия',
                    'Звуковой сигнал',
                    'Возврат на шаг',
                    'Апостроф'
                ],
                correct: 1
            },
            {
                section: 5,
                question: 'Как записать в управляющей последовательности символ с восьмеричным кодом 073?',
                options: [
                    '\\073',
                    '\\0x73',
                    '\\7',
                    '\\x073'
                ],
                correct: 0
            },
            {
                section: 5,
                question: 'Как записать символ с шестнадцатеричным кодом xF5?',
                options: [
                    '\\xF5',
                    '\\0xF5',
                    '\\x0F5',
                    '\\0x0F5'
                ],
                correct: 1
            },
            // Раздел 6: Комментарии (стр. 22)
            {
                section: 6,
                question: 'Какие способы записи комментариев существуют в C++?',
                options: [
                    'Только //',
                    'Только /* */',
                    'И //, и /* */',
                    'Только с помощью директивы #comment'
                ],
                correct: 2
            },
            {
                section: 6,
                question: 'Какой способ записи комментариев рекомендуется использовать для повседневного кодирования?',
                options: [
                    '/* */',
                    '//',
                    'Оба способа равноправны',
                    'Только комментарии в отдельном файле'
                ],
                correct: 1
            },
            {
                section: 6,
                question: 'Можно ли вкладывать многострочные комментарии друг в друга?',
                options: [
                    'Да, в любом количестве',
                    'Нет, это запрещено стандартом',
                    'Да, но только в некоторых компиляторах',
                    'Только в C, но не в C++'
                ],
                correct: 1
            },
            // Раздел 7: Итоговый тест (5 вопросов)
            {
                section: 7,
                question: 'Какое утверждение о лексемах является ВЕРНЫМ?',
                options: [
                    'Лексема — это то же самое, что оператор',
                    'Лексема — минимальная единица языка, имеющая самостоятельный смысл',
                    'Лексема — это всегда одно слово',
                    'Лексема — это пробельный символ'
                ],
                correct: 1
            },
            {
                section: 7,
                question: 'Какой идентификатор является допустимым в C++?',
                options: [
                    '2var',
                    '_private',
                    'int',
                    'my-var'
                ],
                correct: 1
            },
            {
                section: 7,
                question: 'Чему равна длина строковой константы `"A\\\\n"` в байтах (с учётом нуль-символа)?',
                options: [
                    '2 байта',
                    '3 байта',
                    '4 байта',
                    '5 байтов'
                ],
                correct: 2
            },
            {
                section: 7,
                question: 'Какая управляющая последовательность используется для звукового сигнала?',
                options: [
                    '\\n',
                    '\\t',
                    '\\a',
                    '\\r'
                ],
                correct: 2
            },
            {
                section: 7,
                question: 'Почему комментарии важны в программе?',
                options: [
                    'Они увеличивают скорость выполнения программы',
                    'Они улучшают читаемость и понимание кода',
                    'Они исправляют ошибки в программе',
                    'Они обязательны для компиляции'
                ],
                correct: 1
            }
        ];

        // ----- состояние -----
        let currentIndex = 0;
        let userAnswers = new Array(questions.length).fill(null); // индекс выбранного ответа
        let isAnswered = new Array(questions.length).fill(false);
        let allAnswered = false;

        // DOM
        const qText = document.getElementById('qText');
        const optionsContainer = document.getElementById('optionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');
        const currentIdxDisplay = document.getElementById('currentIdxDisplay');
        const totalQuestions = document.getElementById('totalQuestions');
        const answeredCountSpan = document.getElementById('answeredCount');
        const progressPercent = document.getElementById('progressPercent');
        const sectionBadge = document.getElementById('sectionBadge');
        const qTag = document.getElementById('qTag');
        const sectionCounter = document.getElementById('sectionCounter');
        const scoreBadge = document.getElementById('scoreBadge');
        const resultBanner = document.getElementById('resultBanner');
        const finalScore = document.getElementById('finalScore');
        const finalCorrect = document.getElementById('finalCorrect');
        const finalTotal = document.getElementById('finalTotal');
        const gradeBadge = document.getElementById('gradeBadge');
        const statusMsg = document.getElementById('statusMsg');

        const menuButtons = document.querySelectorAll('.menu-btn');

        const sectionNames = [
            'Разд. 1: Состав',
            'Разд. 2: Алфавит',
            'Разд. 3: Идентиф.',
            'Разд. 4: Ключ. слова',
            'Разд. 5: Константы',
            'Разд. 6: Упр. посл.',
            'Разд. 7: Коммент.',
            '⭐ Итоговый тест'
        ];

        totalQuestions.textContent = questions.length;

        function calculateScore() {
            let correct = 0;
            for (let i = 0; i < questions.length; i++) {
                if (isAnswered[i] && userAnswers[i] === questions[i].correct) correct++;
            }
            return Math.round((correct / questions.length) * 100);
        }

        function getGrade(score) {
            if (score >= 85) return { label: 'Отлично (5)', cls: 'grade-5' };
            if (score >= 70) return { label: 'Хорошо (4)', cls: 'grade-4' };
            if (score >= 50) return { label: 'Удовлетворительно (3)', cls: 'grade-3' };
            return { label: 'Неудовлетворительно (2)', cls: 'grade-2' };
        }

        function updateStats() {
            let answered = 0;
            let correct = 0;
            for (let i = 0; i < questions.length; i++) {
                if (isAnswered[i]) {
                    answered++;
                    if (userAnswers[i] === questions[i].correct) correct++;
                }
            }
            answeredCountSpan.textContent = answered;
            const pct = Math.round((answered / questions.length) * 100);
            progressPercent.textContent = pct;
            // Показываем только процент ответов, а не балл (оценка будет в итоге)
            scoreBadge.textContent = `📝 ${pct}%`;

            allAnswered = (answered === questions.length);
            if (allAnswered) {
                const score = calculateScore();
                finalScore.textContent = score;
                finalCorrect.textContent = correct;
                finalTotal.textContent = questions.length;
                const grade = getGrade(score);
                gradeBadge.textContent = grade.label;
                gradeBadge.className = `grade ${grade.cls}`;
                resultBanner.classList.add('show');
                // Обновляем бейдж на финальный балл
                scoreBadge.textContent = `⭐ ${score}`;
            } else {
                resultBanner.classList.remove('show');
            }

            // Обновляем статус
            if (allAnswered) {
                statusMsg.innerHTML = '✅ <strong>Все вопросы отвечены!</strong> Нажмите "Сброс" чтобы пройти заново.';
            } else {
                const left = questions.length - answered;
                statusMsg.textContent = `Осталось ответить на ${left} вопрос${left > 1 ? 'ов' : ''}`;
            }
        }

        function renderQuestion(index) {
            const q = questions[index];
            if (!q) return;

            currentIdxDisplay.textContent = index + 1;
            qTag.textContent = `Вопрос ${index + 1}`;
            sectionBadge.textContent = sectionNames[q.section] || 'Разд.';

            const sameSection = questions.filter((item, idx) => item.section === q.section);
            const posInSection = sameSection.findIndex((item, idx) => questions.indexOf(item) === index);
            sectionCounter.textContent = `${sectionNames[q.section]} · ${posInSection + 1}/${sameSection.length}`;

            qText.textContent = q.question;

            optionsContainer.innerHTML = '';
            const isAnsweredFlag = isAnswered[index];
            const selected = userAnswers[index];

            q.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option';
                if (isAnsweredFlag) {
                    div.classList.add('disabled');
                }
                if (selected === idx) {
                    div.classList.add('selected');
                }

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'question';
                radio.value = idx;
                radio.id = `opt_${idx}`;
                if (selected === idx) radio.checked = true;
                if (isAnsweredFlag) radio.disabled = true;

                const label = document.createElement('label');
                label.htmlFor = `opt_${idx}`;
                label.textContent = opt;
                div.appendChild(radio);
                div.appendChild(label);
                optionsContainer.appendChild(div);

                // Обработка выбора
                const handleSelect = function(e) {
                    if (isAnswered[currentIndex]) return;
                    const radioEl = this.querySelector('input[type="radio"]');
                    if (radioEl && !radioEl.disabled) {
                        radioEl.checked = true;
                        const val = parseInt(radioEl.value);
                        userAnswers[currentIndex] = val;
                        isAnswered[currentIndex] = true;
                        // Перерисовать текущий вопрос, чтобы показать состояние
                        renderQuestion(currentIndex);
                        updateStats();
                        // Автоматически перейти к следующему вопросу, если он есть
                        if (currentIndex < questions.length - 1) {
                            setTimeout(() => goTo(currentIndex + 1), 300);
                        } else {
                            // Если это был последний вопрос, показываем итоги
                            updateStats();
                        }
                    }
                };

                div.addEventListener('click', handleSelect);
                radio.addEventListener('change', function(e) {
                    e.stopPropagation();
                    if (isAnswered[currentIndex]) return;
                    const val = parseInt(this.value);
                    userAnswers[currentIndex] = val;
                    isAnswered[currentIndex] = true;
                    renderQuestion(currentIndex);
                    updateStats();
                    if (currentIndex < questions.length - 1) {
                        setTimeout(() => goTo(currentIndex + 1), 300);
                    } else {
                        updateStats();
                    }
                });
            });

            updateStats();
        }

        function goTo(index) {
            if (index < 0) index = 0;
            if (index >= questions.length) index = questions.length - 1;
            currentIndex = index;
            renderQuestion(currentIndex);
            menuButtons.forEach(btn => {
                const sec = parseInt(btn.dataset.section);
                btn.classList.toggle('active', sec === questions[currentIndex].section);
            });
            // Прокрутка к вопросу на мобильных
            document.querySelector('.question-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) goTo(currentIndex + 1);
        }

        function prevQuestion() {
            if (currentIndex > 0) goTo(currentIndex - 1);
        }

        function filterBySection(sectionIdx) {
            for (let i = 0; i < questions.length; i++) {
                if (questions[i].section === sectionIdx) {
                    goTo(i);
                    return;
                }
            }
        }

        function resetAll() {
            userAnswers.fill(null);
            isAnswered.fill(false);
            allAnswered = false;
            resultBanner.classList.remove('show');
            goTo(0);
        }

        function init() {
            menuButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBySection(parseInt(this.dataset.section));
                });
            });

            prevBtn.addEventListener('click', prevQuestion);
            nextBtn.addEventListener('click', nextQuestion);
            resetBtn.addEventListener('click', resetAll);
            resetAllBtn.addEventListener('click', resetAll);

            // Свайпы на мобильных
            let touchStartX = 0;
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            document.addEventListener('touchend', function(e) {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 60) {
                    if (diff > 0) nextQuestion();
                    else prevQuestion();
                }
            }, { passive: true });

            // Клавиши
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextQuestion();
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevQuestion();
            });

            goTo(0);
        }

        init();
    })();
</script>
</body>
</html>
